name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/task-api-fastapi:latest \
            -t ghcr.io/${{ github.repository_owner }}/task-api-fastapi:${{ github.event.workflow_run.head_sha }} \
            .

      - name: Push latest image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/task-api-fastapi:latest

      - name: Push commit image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/task-api-fastapi:${{ github.event.workflow_run.head_sha }}